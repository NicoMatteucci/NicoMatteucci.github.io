<div id="signDiv">
    Username: <input id="signDiv-username" type="text"></input><br>
    Password: <input id="signDiv-password" type="password"></input>
    <button id="signDiv-signIn">Sign In</button>
    <button id="signDiv-signUp">Sign Up</button>
</div>

<div id="gameDiv" style="display:none;">
    <canvas id="ctx" width="500" height="500" style="border:1px solid #000000;"></canvas>

    <div id="chat-text" style="width:500px;height:300px;overflow-y:scroll">
        <div>Hello! Welcome to the chatroom</div>
    </div>

    <form id="chat-form">
        <input id="chat-input" type="text" style="width:500px"></input>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    //sign part
    var socket = io();
    var signDiv = document.getElementById('signDiv');
    var signDivUsername = document.getElementById('signDiv-username');
    var signDivSignIn = document.getElementById('signDiv-signIn');
    var signDivSignUp = document.getElementById('signDiv-signUp');
    var signDivPassword = document.getElementById('signDiv-password');
    var current_pos = 0;

    signDivSignIn.onclick = function () {
        socket.emit('signIn', { username: signDivUsername.value, password: signDivPassword.value });
    }
    signDivSignUp.onclick = function () {
        socket.emit('signUp', { username: signDivUsername.value, password: signDivPassword.value });
    }
    socket.on('signInResponse', function (data) {
        if (data.success) {
            signDiv.style.display = 'none';
            gameDiv.style.display = 'inline-block';
        } else
            alert("Sign in unsuccessul.");
    });
    socket.on('signUpResponse', function (data) {
        if (data.success) {
            alert("Sign up successul.");
        } else
            alert("Sign up unsuccessul.");//DO NOT USE ON FINAL VERSION, USE OTHER DIV
    });

    //game part
    const width = 1000;
    const height = 1000;
    var chatText = document.getElementById('chat-text');
    var chatInput = document.getElementById('chat-input');
    var chatForm = document.getElementById('chat-form');
    var ctx = document.getElementById("ctx").getContext("2d");
    ctx.font = '40px Arial';

    var img = {};
    img.car = new Image();
    img.car.src = "client/img/car.png";
    img.ship = new Image();
    img.ship.src = "client/img/battle_ship.png";
    img.dog = new Image();
    img.dog.src = "client/img/dog.png";
    img.hat = new Image();
    img.hat.src = "client/img/hat.png";
    img.boot = new Image();
    img.boot.src = "client/img/boot.png";
    img.iron = new Image();
    img.iron.src = "client/img/iron.png";
    img.board = new Image();
    img.board.src = "client/img/tablero.png";
    img.dice_1 = new Image();
    img.dice_1.src = "client/img/dice_1.png";
    img.dice_2 = new Image();
    img.dice_2.src = "client/img/dice_2.png";
    img.dice_3 = new Image();
    img.dice_3.src = "client/img/dice_3.png";
    img.dice_4 = new Image();
    img.dice_4.src = "client/img/dice_4.png";
    img.dice_5 = new Image();
    img.dice_5.src = "client/img/dice_5.png";
    img.dice_6 = new Image();
    img.dice_6.src = "client/img/dice_6.png";

    socket.on('newPosition', function (data) {
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(img.board, 0, 0, 500, 500);
        for (var i = 0; i < data.player.length; i++) {
            if (data.player[i].number === "0") {
                //ctx.drawImage(img.car, data.player[i].x, data.player[i].y);
                ctx.drawImage(img.car, data.player[i].x, data.player[i].y, 50, 50);
            }
            else if (data.player[i].number === "1") {
                //ctx.drawImage(img.ship, data.player[i].x, data.player[i].y);
                ctx.drawImage(img.ship, data.player[i].x, data.player[i].y, 50, 50);
            }
            else if (data.player[i].number === "2") {
                //ctx.drawImage(img.dog, data.player[i].x, data.player[i].y);
                ctx.drawImage(img.dog, data.player[i].x, data.player[i].y, 50, 50);
            }
            else if (data.player[i].number === "3") {
                //ctx.drawImage(img.hat, data.player[i].x, data.player[i].y);
                ctx.drawImage(img.hat, data.player[i].x, data.player[i].y, 50, 50);
            }
            else if (data.player[i].number === "4") {
                //ctx.drawImage(img.hat, data.player[i].x, data.player[i].y);
                ctx.drawImage(img.boot, data.player[i].x, data.player[i].y, 50, 50);
            }
            else if (data.player[i].number === "5") {
                //ctx.drawImage(img.hat, data.player[i].x, data.player[i].y);
                ctx.drawImage(img.iron, data.player[i].x, data.player[i].y, 50, 50);
            }
            else {
                ctx.fillText(data.player[i].number, data.player[i].x, data.player[i].y);
            }
        }
        for (var i = 0; i < data.bullet.length; i++) {
            ctx.fillRect(data.bullet[i].x - 5, data.bullet[i].y - 5, 10, 10);
        }
    });

    socket.on('addToChat', function (data) {
        chatText.innerHTML += '<div>' + data + '</div>';
    });
    socket.on('evalAnswer', function (data) {
        console.log(data);
    });
    socket.on('rolled', function (data) {
        chatText.innerHTML = '<div>' + "dice: " + data + '</div>';
        if (data == "1")
            chatText.innerHTML += '<img src="client/img/dice_1.png" alt="dice 1" style="width:150px;height:150px;">';
        if (data == "2")
            chatText.innerHTML += '<img src="client/img/dice_2.png" alt="dice 1" style="width:150px;height:150px;">';
        if (data == "3")
            chatText.innerHTML += '<img src="client/img/dice_3.png" alt="dice 1" style="width:150px;height:150px;">';
        if (data == "4")
            chatText.innerHTML += '<img src="client/img/dice_4.png" alt="dice 1" style="width:150px;height:150px;">';
        if (data == "5")
            chatText.innerHTML += '<img src="client/img/dice_5.png" alt="dice 1" style="width:150px;height:150px;">';
        if (data == "6")
            chatText.innerHTML += '<img src="client/img/dice_6.png" alt="dice 1" style="width:150px;height:150px;">';
        //<img src="client/dice_1.png" alt="dice 1" style="width:360px;height:356px;">
    });

    chatForm.onsubmit = function (e) {
        e.preventDefault();
        if (chatInput.value[0] === '/')
            socket.emit('evalServer', chatInput.value.slice(1));
        else
            socket.emit('sendMsgToServer', chatInput.value);
        chatInput.value = '';
    }

    document.onkeydown = function (event) {
        if (event.keyCode === 68)//d
            socket.emit('keyPress', { inputId: 'right', state: true });
        else if (event.keyCode === 65)//a
            socket.emit('keyPress', { inputId: 'left', state: true });
        else if (event.keyCode === 87)//w
            socket.emit('keyPress', { inputId: 'up', state: true });
        else if (event.keyCode === 83)//s
            socket.emit('keyPress', { inputId: 'down', state: true });
    }
    document.onkeyup = function (event) {
        if (event.keyCode === 68)
            socket.emit('keyPress', { inputId: 'right', state: false });
        else if (event.keyCode === 65)
            socket.emit('keyPress', { inputId: 'left', state: false });
        else if (event.keyCode === 87)
            socket.emit('keyPress', { inputId: 'up', state: false });
        else if (event.keyCode === 83)
            socket.emit('keyPress', { inputId: 'down', state: false });
    }

    document.onmousedown = function (event) {
        socket.emit('keyPress', { inputId: 'attack', state: true });
    }
    document.onmouseup = function (event) {
        socket.emit('keyPress', { inputId: 'attack', state: false });
    }
    document.onmousemove = function (event) {
        var x = -250 + event.clientX - 8;
        var y = -250 + event.clientY - 8;
        var angle = Math.atan2(y, x) / Math.PI * 180;
        socket.emit('keyPress', { inputId: 'mouseAngle', state: angle });
    }

    //var random = Math.random();

    var f_roll = function () {
        socket.emit('roll', {
            faces: 6,
            pos: current_pos,
        });
    }
    //f_roll();
</script>

<button onclick="f_roll()">
    ROLL DICE
</button>
